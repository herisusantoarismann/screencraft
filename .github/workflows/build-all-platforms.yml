name: Multi-Platform Build & Release

on:
    workflow_dispatch:
        inputs:
            tag:
                description: "Release Tag (e.g. v1.0.0)"
                required: false
                default: "v1.0.0"
    push:
        tags:
            - "v*"

jobs:
    build-tauri:
        permissions:
            contents: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: "windows-latest"
                      args: "--bundles nsis,msi"
                    - platform: "macos-latest"
                      args: "--bundles dmg,app"
                    - platform: "ubuntu-24.04"
                      args: "--bundles deb,appimage"

        runs-on: ${{ matrix.platform }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: "npm"

            - name: Setup Rust stable
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

            - name: Install Linux system dependencies
              if: startsWith(matrix.platform, 'ubuntu')
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libpipewire-0.3-dev libspa-0.2-dev clang libgbm-dev libdrm-dev libwayland-dev

            - name: Install frontend dependencies
              run: npm ci

            - name: Build Tauri Application
              uses: tauri-apps/tauri-action@v0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
              with:
                  tagName: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag || 'v1.0.0' }}
                  releaseName: ScreenCraft ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag || 'v1.0.0' }}
                  releaseBody: "Release binaries for ScreenCraft."
                  releaseDraft: false
                  prerelease: false
                  args: ${{ matrix.args }}
